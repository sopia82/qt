[project]
name = "quantum-trading"
version = "0.1.0"
description = "Institutional-grade Dual-Horizon Quantum Trading Analysis Protocol for S&P 500 and KOSPI 100"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.36",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "schedule>=1.2.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "pykrx>=1.0.45",
    "feedparser>=6.0.10"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
